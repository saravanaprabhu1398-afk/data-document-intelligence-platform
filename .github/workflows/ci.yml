name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff pytest pyyaml

      - name: Lint
        run: ruff check src/ tests/

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Validate data contracts
        run: python scripts/validate_contracts.py
        continue-on-error: true   # remove once contracts are written
